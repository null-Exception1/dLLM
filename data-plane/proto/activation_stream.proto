syntax = "proto3";

package dllm.network;

option go_package = "dllm-cluster/data-plane/proto";

// The ActivationStream service handles high-throughput, cross-shard tensor transfers
service ActivationStream {
    rpc StreamLayerActivations (ActivationPayload) returns (StreamAck);
}

// Optimized network payload for the 35% compressed tensor data
message ActivationPayload {
    uint64 prompt_hash           = 1; // Unique conversation identifier (Macro-route mapping)
    uint32 task_serial_number    = 2; // Fixed serial (0-4) mapped to our speculative branches
    uint32 layer_index           = 3; // The exact downstream layer target (e.g., Layer 8)
    
    float global_min             = 4; // Min value from float32 scan
    float global_max             = 5; // Max value from float32 scan
    float scale_factor           = 6; // Dynamic scale multiplier
    
    bytes quantized_tensor       = 7; // Packed INT8 bytes of our 35% outlier peaks
    bytes sparse_bitmask         = 8; // Compressed binary mask (8 boolean flags packed per byte)
}

message StreamAck {
    bool success                 = 1;
    string error_message         = 2;
    string generated_token       = 3; // FIX: The network pipeline return lane for text delivery
}