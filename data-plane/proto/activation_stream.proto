syntax = "proto3";

package dllm.network;

option go_package = "dllm-cluster/data-plane/proto;proto";

service ActivationStream {
    rpc StreamLayerActivations (ActivationPayload) returns (StreamAck);
}

message ActivationPayload {
    uint64 prompt_hash           = 1;
    uint32 task_serial_number    = 2; // Speculative Branch trajectory ID
    uint32 layer_index           = 3; // Dynamic layer hop tracker
    bytes quantized_tensor       = 4; // Main hidden state activation matrix
    bytes sparse_bitmask         = 5; // Task 2.4 outlier compression bits
    repeated int64 token_ids     = 6; // Active token sequence history string
    float cumulative_logprob     = 7; // Running probability track score
    repeated int64 position_ids  = 8; // Explicit structural token sequence coordinates
}

message StreamAck {
    bool success                 = 1;
    string error_message         = 2;
    string generated_token       = 3;
    float step_logprob           = 4;
}
